[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kg-rag"
version = "0.1.0"
description = "GraphRAG: hybrid knowledge-graph + vector RAG over research papers"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # --- LLM (default backend) ---
    "mistralai>=2.9.0",
    # --- storage ---
    "kuzu>=0.11.3",
    "chromadb>=1.5.9",
    # --- retrieval ---
    "fastembed>=0.8.0",
    "rank-bm25>=0.2.2",
    # --- graph analytics ---
    "igraph>=1.0.0",
    "leidenalg>=0.12.0",
    "networkx>=3.4",
    # --- ingestion ---
    "pymupdf>=1.28.0",
    "arxiv>=4.0.0",
    # --- app ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pyvis>=0.3.2",
    # --- plumbing ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "structlog>=24.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Optional second backend, used only for the extraction-quality ablation.
anthropic = ["anthropic>=1.3.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
graphrag = "graphrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real LLM API (deselect with '-m \"not live\"')",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
